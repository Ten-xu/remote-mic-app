name: Hardened Fork CI

on:
  workflow_dispatch:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main, security-hardening]

concurrency:
  group: hardened-fork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify Sparkle security floor
        shell: bash
        run: |
          grep -F '.package(url: "https://github.com/sparkle-project/Sparkle", from: "2.9.6")' Package.swift
          grep -F '"version" : "2.9.6"' Package.resolved

      - name: Verify upstream automatic update path is disabled
        shell: bash
        run: |
          ! grep -q '<key>SUFeedURL</key>' Resources/Info.plist
          grep -A1 '<key>SUEnableAutomaticChecks</key>' Resources/Info.plist | grep -q '<false/>'
          grep -A1 '<key>SUAutomaticallyUpdate</key>' Resources/Info.plist | grep -q '<false/>'
          grep -A1 '<key>SUAllowsAutomaticUpdates</key>' Resources/Info.plist | grep -q '<false/>'

      - name: Verify Bluetooth-only permission surface
        shell: bash
        run: |
          grep -q '<key>NSBluetoothAlwaysUsageDescription</key>' Resources/Info.plist
          ! grep -q '<key>NSLocalNetworkUsageDescription</key>' Resources/Info.plist
          ! grep -q '<key>NSBonjourServices</key>' Resources/Info.plist

      - name: Reject private production package injection hooks
        shell: bash
        run: |
          ! grep -q 'SAYALL_AI_PACKAGE_PATH' Package.swift
          ! grep -q 'SAYALL_MACRO_PLATFORM_PATH' Package.swift
          ! grep -q 'SAYALL_MEMBERSHIP_PACKAGE_PATH' Package.swift
          ! grep -q 'SAYALL_PRIVATE_ARTIFACT_PACKAGE_PATH' Package.swift

      - name: Verify switchable hardened remote mode
        shell: bash
        run: |
          grep -q 'REMOTE_MIC_HARDENED_REMOTE' Package.swift
          grep -q 'if !useHardenedRemoteCompatibility' Package.swift
          grep -q 'name: "SayAllMacRemoteCore"' Package.swift
          grep -q 'name: "SayAllMacRemoteUI"' Package.swift

      - name: Enforce inert local remote compatibility layer
        shell: bash
        run: |
          test -d Sources/SayAllMacRemoteCore
          test -d Sources/SayAllMacRemoteUI
          for token in \
            'import Network' \
            'import CoreBluetooth' \
            'URLSession' \
            'NWListener' \
            'NWConnection' \
            'NWBrowser' \
            'webSocketTask' \
            '_remotemic._tcp' \
            'WebSocket' \
            'Bonjour'; do
            if grep -R -n -F "$token" Sources/SayAllMacRemoteCore Sources/SayAllMacRemoteUI; then
              echo "Forbidden remote transport token in compatibility layer: $token" >&2
              exit 1
            fi
          done

      - name: Detect final private-dependency removal
        id: dependency
        shell: bash
        run: |
          if grep -q 'GetSayAll/sayall-mac-remote' Package.swift; then
            echo 'independent=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Default manifest still contains the transitional upstream remote dependency.'
          else
            echo 'independent=true' >> "$GITHUB_OUTPUT"
          fi

    outputs:
      independent: ${{ steps.dependency.outputs.independent }}

  compatibility-compile:
    name: Compile inert compatibility modules
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Compile hardened core module without SwiftPM resolution
        run: |
          mkdir -p "$RUNNER_TEMP/hardened-modules"
          swiftc \
            -parse-as-library \
            -emit-module \
            -emit-module-path "$RUNNER_TEMP/hardened-modules/SayAllMacRemoteCore.swiftmodule" \
            -module-name SayAllMacRemoteCore \
            Sources/SayAllMacRemoteCore/*.swift

      - name: Compile hardened UI module without SwiftPM resolution
        run: |
          swiftc \
            -parse-as-library \
            -emit-module \
            -I "$RUNNER_TEMP/hardened-modules" \
            -emit-module-path "$RUNNER_TEMP/hardened-modules/SayAllMacRemoteUI.swiftmodule" \
            -module-name SayAllMacRemoteUI \
            Sources/SayAllMacRemoteUI/*.swift

  hardened-remote-build:
    name: Build with private remote package excluded
    runs-on: macos-15
    env:
      REMOTE_MIC_HARDENED_REMOTE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify private remote is absent from resolved graph
        run: |
          swift package resolve
          swift package show-dependencies > "$RUNNER_TEMP/dependencies.txt"
          ! grep -q 'sayall-mac-remote' "$RUNNER_TEMP/dependencies.txt"

      - name: Build local compatibility targets
        run: |
          swift build --target SayAllMacRemoteCore
          swift build --target SayAllMacRemoteUI

      - name: Compile application against local compatibility modules
        run: swift build

  independent-build:
    name: Final independent Swift build
    needs: security-baseline
    if: needs.security-baseline.outputs.independent == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            variant: apple-silicon
            triple: arm64-apple-macosx14.0
          - label: Intel Ventura
            variant: intel
            triple: x86_64-apple-macosx13.0
    env:
      RELEASE_VARIANT: ${{ matrix.variant }}
      REMOTE_MIC_HARDENED_REMOTE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests
        run: swift test

      - name: Build release configuration
        run: swift build -c release --triple "${{ matrix.triple }}"
